[package]
name = "examples"
description = "Example of using the Lumine HTTP web server."
repository = "https://github.com/Ellen-desu/lumine"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[dependencies]
lumine = { path = "../lumine", features = ["filestream"] }
http = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"

[[example]]
name = "hello_world"
path = "1_hello_world.rs"

[[example]]
name = "routing"
path = "2_routing.rs"

[[example]]
name = "response"
path = "3_response.rs"

[[example]]
name = "request"
path = "4_request.rs"

[[example]]
name = "parameters"
path = "5_parameters.rs"

[[example]]
name = "middleware"
path = "6_middleware.rs"
