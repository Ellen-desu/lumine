[package]
name = "lumine"
description = "A simple and minimal HTTP web server."
version = "0.4.4"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ellen-desu/lumine"
categories = ["web-programming::http-server", "web-programming", "network-programming"]
keywords = ["http", "web-server", "network", "lightweight"]

[dependencies]
http = "1.4"
form_urlencoded = "1.2"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["now"] }

[dev-dependencies]
ureq = "3.3"
pretty_assertions  = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
bench = []
