[package]
name = "lumine"
description = "A lightweight async HTTP web framework for Rust."
version = "0.8.2"
edition = "2024"
license = "MIT"
readme = "README.md"
homepage = "https://ouzuka-m.github.io/lumine"
documentation = "https://docs.rs/lumine/latest"
repository = "https://github.com/ouzuka-m/lumine"
categories = ["web-programming::http-server", "web-programming", "network-programming", "parsing", "parser-implementations"]
keywords = ["http", "web-server", "network", "lightweight", "async"]

[dependencies]
http = "1.5"
form_urlencoded = "1.2"
tokio = { version =  "1.53", features = ["net", "rt", "io-util", "fs", "time", "sync"] }
async-trait = "0.1"
httpdate = "1.0"
bytes = "1.12"
memchr = "2.8"

infer = { version = "0.22", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"], optional = true }

[features]
filestream = ["dep:infer"]
tls = ["dep:tokio-rustls"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
